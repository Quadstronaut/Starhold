##
## Starhold Peridot relay: strfry 1.1.3 config (PERI-14). Baked into the image at /etc/strfry.conf (the default
## path strfry reads), so the running config is exactly this file at the deployed git revision.
## Every value that differs from strfry's own default carries a comment saying why.
##

# The data volume (one named volume, mounted here by the quadlet).
db = "/var/lib/strfry/"

dbParams {
    maxreaders = 256

    # LMDB map size: also the most disk the database can ever use. 32 GiB (strfry default: 10 TiB). Peridot stores
    # about one event per entry per circle, so years of use stay in the low gigabytes; a flood stops here instead
    # of filling the shared disk.
    mapsize = 34359738368

    noReadAhead = false
}

events {
    # Largest real Peridot event, measured from the app's own builders (PERI-14): a problem report at its caps
    # (4000 four-byte characters) is 22,450 bytes; a Delete-all-data request with 100 addresses is 15,769 bytes;
    # a 12-member list is 9,612 bytes. 32 KiB leaves about 45% headroom. (strfry default: 64 KiB.)
    maxEventSize = 32768

    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300

    # Most tags Peridot puts on one event: 102 (a deletion request: 100 addresses + 2 kinds). (Default: 2000.)
    maxNumTags = 128

    # Longest tag value: the encrypted circle name on a key delivery grows with the name, and the app does not cap
    # the name's length. 4 KiB fits a name of about 2,900 bytes. (Default: 1024.)
    maxTagValSize = 4096
}

relay {
    # Inside the container only. The quadlet publishes the port on the host's 127.0.0.1 and nowhere else.
    bind = "0.0.0.0"
    port = 7777

    # 0 = strfry does not try to raise its open-file limit (a rootless container cannot). The quadlet's Ulimit sets
    # it, and that limit is also the relay's overall connection cap.
    nofiles = 0

    # EMPTY ON PURPOSE. strfry would otherwise take the client's address from this header. Left empty, strfry only
    # ever sees the server's own address (rootless port forwarding), so its "Connect from" log lines and the write policy hold no client IP.
    realIpHeader = ""

    auth {
        # No NIP-42 sign-in: the Peridot app does not support it, and reads of every kind (including kind 1059 key
        # deliveries) must work without it. strfry 1.1.3 has no restrictedReadKinds setting and gates no read on
        # sign-in; the kind 1059 read without sign-in is proved against the live relay (PERI-14).
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "Starhold Peridot relay"
        description = "Run by Starhold for the Peridot app. Accepts only Peridot circle events; everything else is rejected."
        pubkey = ""
        self = ""
        contact = "hello@starhold.dev"
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    # A websocket frame carries one message; the largest is an EVENT of maxEventSize plus a little framing.
    # (Default: 128 KiB.)
    maxWebsocketPayloadSize = 65536

    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000

    # The app asks for a circle's whole history with no "limit" (cycle_sync_subscriber.dart). strfry's default of
    # 500 would silently hand back only the newest 500 events of a busy circle, and a new member or a restore would
    # miss the rest. (Default: 500.)
    maxFilterLimit = 20000

    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200

    writePolicy {
        # write-policy.py in this folder. It fails closed: strfry rejects the event on a crash, bad answer or timeout.
        plugin = "/app/write-policy.py"

        # A healthy answer takes microseconds. strfry writes one event at a time while it waits, so a stuck plugin
        # must not hold every writer for long. (Default: 10.)
        timeoutSeconds = 3
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        # No message dumps of any kind.
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 1
    }

    negentropy {
        # Off: Peridot never uses negentropy set reconciliation, and it would let anyone diff the whole database
        # cheaply. (Default: on.)
        enabled = false
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
