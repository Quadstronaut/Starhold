<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link rel="preload" href="/fonts/michroma-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<!-- Star chart switch (STAR-166 R5): add class="has-starchart" to <body> to show the hero
	     star chart. Off by default since round 2 (F3): the hero art now has its own sky. -->
	<body data-sveltekit-preload-data="hover">
		<!-- display:contents lives in app.css as #app-shell — no style attribute -->
		<div id="app-shell">%sveltekit.body%</div>
	</body>
</html>
